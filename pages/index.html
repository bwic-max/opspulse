function pcard(p,g){const k=stat(p),a=admin(),pk=!!p.packed,nm=esc(p.name)+(uspec(p)?' • '+esc(uspec(p)):''),sty=pk?' style="font-size:16px"':'';
const minus=a?`<button data-a="adj" data-id="${p.id}" data-d="-1"${sty} aria-label="Remove one ${pk?'pack':'item'} of ${esc(p.name)}">${pk?'− Pack':'−'}</button>`:'',plus=`<button class="pri" data-a="adj" data-id="${p.id}" data-d="1"${sty} aria-label="Add one ${pk?'pack':'item'} of ${esc(p.name)}">${pk?'+ Pack':'+'}</button>`;
const pa=Math.floor(p.stock/(p.ppp||1)),pb=p.stock%(p.ppp||1);
const big=pk?(pa?`<span class="sn">${pa}</span><span class="su">${pa==1?'pack':'packs'}${pb?', '+pb+(pb==1?' pc':' pcs'):''}</span>`:`<span class="sn">${pb}</span><span class="su">${pb==1?'pc':'pcs'}</span>`):`<span class="sn">${p.stock}</span><span class="su">${unitNoun(p,p.stock)}</span>`;
const sub=pk?`<div class="mut">${p.stock} pcs total • ${p.ppp} pcs/pack</div>`:'',price=pk?`${money(p.packPrice)} / pack · ${money(p.piecePrice)} / pc`:money(p.price),ro=pk?`Reorder at ${p.reorder} ${p.reorder==1?'pack':'packs'}`:`Reorder at ${p.reorder}`;
return g?`<div class="pc ${k}" data-pc="${p.id}"><div class="pn">${nm}</div><div class="stk">${big}</div>${sub}${pTag(p)}<div class="pp"${pk?' style="font-size:15px"':''}>${price}</div><div class="mut">${ro}</div><div class="adj">${minus}${plus}</div></div>`
:`<div class="card" data-pc="${p.id}"><div class="row sp"><div><h3>${nm}</h3><div class="mut">${esc(p.sku)} ${p.sku?'· ':''}${esc(p.cat)} · ${price}</div></div>${pTag(p)}</div><div class="row sp" style="margin-top:8px"><div><span class="stk">${big}</span>${sub}<div class="mut">${ro}</div></div><div class="step">${minus}${plus}</div></div></div>`}
function invList(){const g=U.invView!='list',L=S.products.filter(p=>(U.inv=='all'||(U.inv=='low'?stat(p)=='low':stat(p)=='out'))&&(U.cat=='All'||p.cat==U.cat)&&(label(p)+p.sku).toLowerCase().includes(U.invQ.toLowerCase())),h=L.map(p=>pcard(p,g)).join('');
return h?(g?`<div class="igrid">${h}</div>`:h):'<div class="card mut">No products match.</div>'}

function rangeOf(){const n=Date.now(),t=sod(n);if(U.rng=='today')return[t,t+DAY];if(U.rng=='week')return[t-6*DAY,t+DAY];if(U.rng=='month'){const d=new Date(t);d.setDate(1);return[+d,t+DAY]}return[U.from?sod(U.from+'T00:00'):0,U.to?sod(U.to+'T00:00')+DAY:t+DAY]}
const sName=s=>s.items.map(i=>i.unit?i.qty+' '+(i.unit=='pack'?(i.qty==1?'pack':'packs'):(i.qty==1?'pc':'pcs'))+' '+label(P(i.pid)):i.qty+'× '+label(P(i.pid))).join(', ');
function salesList(){const[a,b]=rangeOf();const L=S.sales.filter(s=>s.ts>=a&&s.ts<b&&(sName(s)+s.pay+s.id+(s.by||'')).toLowerCase().includes(U.sq.toLowerCase()));
return L.map(s=>`<button class="card" style="width:100%;text-align:left;font-weight:500" data-a="sale-d" data-id="${s.id}"><div class="row sp"><b>${money(s.total)} #${s.id}</b><span>${s.editedAt?tag('Edited','info')+' ':''}${s.void?tag('Voided','bad'):tag(s.pay,'neu')}</span></div><div class="mut">${esc(sName(s))}</div><div class="mut">${tm(s.ts)} by ${esc(s.by||'')}${s.editedAt?' · edited '+tm(s.editedAt):''}</div></button>`).join('')||'<div class="card mut">No sales in this range.</div>'}
function grp(L,f,v){const q={};L.forEach(s=>f(s).forEach(([k,n,r])=>{q[k]=q[k]||[0,0];q[k][0]+=n;q[k][1]+=r}));return Object.entries(q).sort((x,y)=>y[1][1]-x[1][1])}
function report(){const[a,b]=rangeOf(),L=S.sales.filter(s=>!s.void&&s.ts>=a&&s.ts<b),rev=L.reduce((x,s)=>x+s.total,0);
const top=grp(L,s=>s.items.map(i=>[label(P(i.pid))+(i.unit?(i.unit=='pack'?' (by pack)':' (by piece)'):''),i.qty,i.qty*i.price])).slice(0,5),pay=grp(L,s=>[[s.pay,1,s.total]]),by=grp(L,s=>[[s.by||'—',1,s.total]]);
const rows=(g,u)=>g.map(t=>`<div class="row sp" style="padding:6px 0"><span>${esc(t[0])}</span><span><b>${money(t[1][1])}</b> <span class="mut">${t[1][0]} ${u}</span></span></div>`).join('')||'<div class="mut">No sales yet in this range.</div>';
return `<div class="chips">${[['today','Today'],['week','This Week'],['month','This Month'],['custom','Custom']].map(c=>`<button class="chip ${U.rng==c[0]?'on':''}" data-a="rng" data-v="${c[0]}">${c[1]}</button>`).join('')}</div>
${U.rng=='custom'?`<div class="two" style="margin-bottom:12px"><div><label class="f">From</label><input type="date" data-q="from" value="${U.from}"></div><div><label class="f">To</label><input type="date" data-q="to" value="${U.to}"></div></div>`:''}
<div class="card"><div class="mut">Revenue</div><div class="big">${money(rev)}</div><div class="row wrap" style="margin-top:8px"><span>${L.length} orders</span><span class="mut">avg ${money(L.length?Math.round(rev/L.length*100)/100:0)}</span></div></div>
<div class="card"><div class="mut">Estimated profit</div><div class="big" style="font-size:28px">${money(profit(L))}</div><div class="mut">Sales minus what the items cost you</div></div>
<div class="card"><h3>Top sellers</h3>${rows(top,'sold')}</div><div class="card"><h3>By payment method</h3>${rows(pay,'sales')}</div><div class="card"><h3>By team member</h3>${rows(by,'sales')}</div>
<h2>Sales log</h2><input data-q="sales" placeholder="Search sales" value="${esc(U.sq)}" aria-label="Search sales" style="margin-bottom:12px"><div id="salesList">${salesList()}</div>`}

const N=[['dash','Dashboard'],['inv','Inventory'],...(a?[['report','Reports']]:[]),['entry','Data Entry']];

const cartTotal=()=>cartItems().reduce((a,i)=>a+i.qty*i.price,0);
const cartPieces=(pid,except)=>Object.entries(U.cart).reduce((a,[k,q])=>{const[id,u]=k.split(':');return a+(id==pid&&k!=except?(u=='pack'?q*P(id).ppp:q):0)},0);
function packedRow(p){const u=U.sel[p.id]||'pack',qp=U.cart[ckey(p.id,'pack')]||0,qc=U.cart[ckey(p.id,'piece')]||0,cur=u=='pack'?qp:qc,inc=[qp&&qp+' '+(qp==1?'pack':'packs'),qc&&qc+' '+(qc==1?'pc':'pcs')].filter(Boolean).join(' + ');
