obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,'<< /Type /Pages /Kids ['+pages.map((_,i)=>(5+2*i)+' 0 R').join(' ')+'] /Count '+pages.length+' >>');

pages.forEach((pg,i)=>{const c='BT /F2 14 Tf '+M+' '+(PH-M)+' Td ('+esc2(title)+') Tj ET\nBT /F1 9 Tf '+M+' '+(PH-M-16)+' Td ('+esc2(sub)+') Tj ET\nBT /F1 '+size+' Tf '+M+' '+(PH-M-40)+' Td '+LH+' TL\n'+pg.map(l=>'('+esc2(l)+') Tj T*').join('\n')+'\nET\nBT /F1 8 Tf '+M+' 24 Td (Page '+(i+1)+' of '+pages.length+') Tj ET';
obj(5+2*i,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+PW+' '+PH+'] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents '+(6+2*i)+' 0 R >>');obj(6+2*i,'<< /Length '+c.length+' >>\nstream\n'+c+'\nendstream')});
const xo=out.length;out+='xref\n0 '+(N+1)+'\n0000000000 65535 f \n'+off.slice(1).map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+'trailer\n<< /Size '+(N+1)+' /Root 1 0 R >>\nstartxref\n'+xo+'\n%%EOF';
